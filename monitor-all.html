<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok SRT 多服务器监控</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI',system-ui,sans-serif; background:#0b0d14; color:#e0e0e0; padding:20px; min-height:100vh; }
  .topbar { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid #1e2230; margin-bottom:20px; background:#0f111b; position:sticky; top:0; z-index:10; }
  .topbar h1 { font-size:20px; color:#fff; }
  .topbar .meta { display:flex; gap:16px; font-size:12px; color:#555; align-items:center; }
  .hb { display:flex; align-items:center; gap:6px; font-size:12px; }
  .hb .dot { width:6px; height:6px; border-radius:50%; display:inline-block; }
  .hb .dot.green { background:#4ade80; box-shadow:0 0 6px #4ade80; animation:pulse 1.5s infinite; }
  .hb .dot.yellow { background:#f59e0b; }
  .hb .dot.red { background:#f87171; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .server-block { margin-bottom:24px; }
  .server-header { display:flex; align-items:center; gap:10px; padding:10px 0; cursor:pointer; }
  .server-header h2 { font-size:16px; color:#aaa; }
  .server-header .status-dot { width:10px; height:10px; border-radius:50%; }
  .server-header .status-dot.ok { background:#4ade80; }
  .server-header .status-dot.err { background:#f87171; }
  .server-header .urls { font-size:11px; color:#555; margin-left:auto; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(310px, 1fr)); gap:12px; }
  .card { background:#131620; border-radius:8px; padding:16px; border:1px solid #1e2230; }
  .card .name { font-size:15px; font-weight:700; color:#fff; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
  .card .name .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .card .name .dot.live { background:#4ade80; box-shadow:0 0 6px #4ade80; animation:pulse 1.5s infinite; }
  .card .name .dot.dead { background:#444; }

  .row { display:flex; justify-content:space-between; align-items:center; padding:4px 0; }
  .row .lbl { font-size:12px; color:#666; }
  .badge { padding:3px 10px; border-radius:16px; font-size:11px; font-weight:600; }
  .badge.online { background:#0d3320; color:#4ade80; border:1px solid #166534; }
  .badge.offline { background:#251010; color:#f87171; border:1px solid #7f1d1d; }
  .badge.reading { background:#0d2633; color:#60a5fa; border:1px solid #1e40af; }

  .url-area { margin-top:8px; background:#0b0d14; border-radius:4px; padding:8px; }
  .url-area .t { font-size:10px; color:#555; margin-bottom:2px; }
  .url-area code { font-size:10px; color:#777; word-break:break-all; }
  .last-seen { font-size:10px; color:#444; margin-top:8px; text-align:right; }

  .config-panel { position:fixed; top:0; right:0; width:380px; height:100%; background:#131620; border-left:1px solid #1e2230; padding:24px; z-index:100; overflow-y:auto; display:none; }
  .config-panel.show { display:block; }
  .config-panel h3 { font-size:16px; color:#fff; margin-bottom:16px; }
  .config-panel textarea { width:100%; height:200px; background:#0b0d14; color:#ccc; border:1px solid #1e2230; border-radius:6px; padding:12px; font-family:monospace; font-size:12px; resize:vertical; }
  .config-panel button { margin-top:10px; padding:8px 20px; border-radius:6px; border:none; background:#2563eb; color:#fff; cursor:pointer; font-size:13px; }
  .config-panel .close { float:right; color:#666; cursor:pointer; font-size:18px; }
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:99; display:none; }
  .overlay.show { display:block; }
  .toggle-btn { padding:6px 14px; background:#1e2230; border:1px solid #2a2d3a; color:#888; border-radius:6px; cursor:pointer; font-size:12px; }
  .toggle-btn:hover { color:#fff; border-color:#444; }

  .footer { text-align:center; padding:30px 0; font-size:11px; color:#333; }

  @media (max-width:700px) {
    .grid { grid-template-columns:1fr; }
    .config-panel { width:100%; }
  }
</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="toggleConfig()"></div>
<div class="config-panel" id="config-panel">
  <span class="close" onclick="toggleConfig()">&times;</span>
  <h3>服务器配置</h3>
  <p style="font-size:12px;color:#666;margin-bottom:10px;">每行一个服务器，格式: 名称 IP:端口</p>
  <textarea id="cfg-text"></textarea>
  <button onclick="saveConfig()">保存</button>
</div>

<div class="topbar">
  <h1>TikTok SRT 多服务器监控</h1>
  <div class="meta">
    <span id="total-streams">0 路推流</span>
    <span id="online-count">0 在线</span>
    <span class="hb"><span class="dot green" id="global-hb"></span><span id="update-time">--</span></span>
    <button class="toggle-btn" onclick="toggleConfig()">配置服务器</button>
  </div>
</div>

<div id="servers"></div>
<div class="footer">TikTok SRT Relay Monitor</div>

<script>
const STORAGE_KEY = 'srt-monitor-servers';

function getServers() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch { return []; }
}
function setServers(v) { localStorage.setItem(STORAGE_KEY, JSON.stringify(v)); }

function toggleConfig() {
  const p = document.getElementById('config-panel');
  const o = document.getElementById('overlay');
  const show = !p.classList.contains('show');
  p.classList.toggle('show', show);
  o.classList.toggle('show', show);
  if (show) {
    const servers = getServers();
    document.getElementById('cfg-text').value = servers.map(s => `${s.name} ${s.host}:${s.port}`).join('\n');
  }
}

function saveConfig() {
  const lines = document.getElementById('cfg-text').value.trim().split('\n').filter(Boolean);
  const servers = lines.map(line => {
    const parts = line.trim().split(/\s+/);
    const last = parts[parts.length - 1];
    const [host, port] = last.split(':');
    return {
      name: parts.slice(0, -1).join(' ') || host,
      host,
      port: port || '9988'
    };
  });
  setServers(servers);
  toggleConfig();
  refreshAll();
}

let onlineCount = 0;
let totalStreams = 0;

async function fetchServer(server) {
  try {
    const r = await fetch(`http://${server.host}:${server.port}/api/status`, { signal: AbortSignal.timeout(5000) });
    const data = await r.json();
    return { ...server, ok: true, data };
  } catch {
    return { ...server, ok: false, data: null };
  }
}

async function refreshAll() {
  const servers = getServers();
  if (!servers.length) {
    document.getElementById('servers').innerHTML = '<p style="color:#555;text-align:center;padding:40px;">点击右上角"配置服务器"添加 VPS</p>';
    return;
  }

  const results = await Promise.all(servers.map(fetchServer));

  onlineCount = 0;
  totalStreams = 0;
  let html = '';

  results.forEach(s => {
    const cls = s.ok ? 'ok' : 'err';
    html += `<div class="server-block">`;
    html += `<div class="server-header">`;
    html += `<span class="status-dot ${cls}"></span>`;
    html += `<h2>${s.name}</h2>`;
    html += `<span class="urls">${s.host}:${s.port}</span>`;
    html += `</div>`;

    if (s.ok && s.data) {
      totalStreams += s.data.streams.length;
      s.data.streams.forEach(st => {
        if (st.publishing || st.readers > 0) onlineCount++;
        if (st.publishing) onlineCount++;
        if (st.readers > 0) onlineCount++;
      });
      html += `<div class="grid">`;
      if (s.data.streams.length === 0) {
        html += `<div class="card" style="text-align:center;color:#444;padding:24px;">暂无推流</div>`;
      } else {
        s.data.streams.forEach(st => {
          html += `
            <div class="card">
              <div class="name">
                <span class="dot ${st.publishing ? 'live' : 'dead'}"></span>${st.name}
              </div>
              <div class="row">
                <span class="lbl">推流</span>
                <span class="badge ${st.publishing ? 'online' : 'offline'}">${st.publishing ? '在线' : '离线'}</span>
              </div>
              <div class="row">
                <span class="lbl">拉流</span>
                <span class="badge ${st.readers > 0 ? 'reading' : 'offline'}">${st.readers > 0 ? st.readers + ' 路' : '无连接'}</span>
              </div>
              <div class="url-area">
                <div class="t">推流</div>
                <code>srt://${s.data.host}:${s.data.port}?streamid=publish:${st.name}&amp;passphrase=***</code>
              </div>
              <div class="url-area">
                <div class="t">拉流</div>
                <code>srt://${s.data.host}:${s.data.port}?streamid=read:${st.name}&amp;passphrase=***</code>
              </div>
              <div class="last-seen">${st.last_event || '--'}</div>
            </div>`;
        });
      }
      html += `</div>`;
    } else {
      html += `<div style="color:#f87171;font-size:13px;padding:8px 0;">无法连接</div>`;
    }
    html += `</div>`;
  });

  document.getElementById('servers').innerHTML = html;
  document.getElementById('total-streams').textContent = `${results.reduce((a,s) => a + (s.data?.streams?.length || 0), 0)} 路推流`;
  document.getElementById('online-count').textContent = `${onlineCount} 活跃`;
  document.getElementById('update-time').textContent = new Date().toLocaleTimeString();

  const allOk = results.every(r => r.ok);
  const someOk = results.some(r => r.ok);
  const hb = document.getElementById('global-hb');
  hb.className = 'dot ' + (allOk ? 'green' : someOk ? 'yellow' : 'red');
}

if (!getServers().length) {
  document.getElementById('servers').innerHTML = '<p style="color:#555;text-align:center;padding:40px;">点击右上角"配置服务器"添加 VPS<br><span style="font-size:12px;">例如: VPS-01 154.12.53.31:9988</span></p>';
}

refreshAll();
setInterval(refreshAll, 5000);
</script>
</body>
</html>
